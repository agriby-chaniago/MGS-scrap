[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelgate"
version = "0.0.0.dev0"
description = "Reference implementation of MGS (Model Gate Specification) — dataset quality evaluation for computer vision datasets."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Agrieby Chaniago" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# Zero infra dependencies, deliberately (see ROADMAP.md Fase 2 exit
# criteria): no FastAPI, SQLAlchemy, MinIO, pika. modelgate-core MUST be
# installable and runnable with nothing but Python + these.
dependencies = [
    "Pillow>=10.3.0",
    "numpy>=1.26.4",
    "imagehash>=4.3.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/agriby-chaniago/MGS"
Specification = "https://github.com/agriby-chaniago/MGS/blob/main/specs/mgs/MGS-1.0-draft.md"

# Placeholder — the actual `modelgate` CLI command is built in Fase 4
# (ROADMAP.md). Declared here now so the packaging shape doesn't change
# later (Fase 1c: "struktur paket yang berubah setelah orang mulai pip
# install itu breaking change").
[project.scripts]
modelgate = "modelgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modelgate"]

[tool.mypy]
strict = true
packages = ["modelgate"]
