name: MGS Conformance

# Fase 3 exit criteria (ROADMAP.md): CI must fail on any conformance
# mismatch — not just build container images (that's build.yml). This is
# the gate that makes MGS a specification rather than a claim: any PR
# that changes modelgate-core's Reader/Checker/Report behavior has to
# still reproduce every frozen expected/*.json exactly, or this fails.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install modelgate-core
        run: pip install -e packages/modelgate-core

      - name: Run conformance corpus (direct CLI — first interface)
        run: python3 conformance/runner.py

      - name: Run conformance corpus (GitHub Action's own steps — Fase 6)
        # This exercises packages/github-action/action.yml's actual logic
        # (via conformance/action_client.py, which replays the same
        # steps), not just the CLI a second time — a fourth interface
        # proving G5 (BACKLOG.md), alongside core/CLI (direct import) and
        # server (conformance/server_client.py, run manually — the full
        # Docker stack it needs isn't set up in this CI job).
        run: python3 conformance/runner.py --tool "python3 conformance/action_client.py"
