name: Build & Push Images

# Manual-only (workflow_dispatch), not triggered on every push/PR anymore —
# every image this builds (server microservices, Streamlit, React) is
# archived per the project's pivot to a library-first focus (see
# packages/modelgate-server/README.md and CONTRIBUTING.md). Building and
# pushing these on every commit would burn CI minutes and GHCR storage
# for images nobody's consuming. Kept, not deleted, in case the server
# stack is ever revived — run it by hand from the Actions tab if needed.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # `name` is the image/tag name (unchanged, so existing GHCR tags keep
        # their history); `context` is the post-monorepo-restructure path
        # (Fase 1) — the two diverged once services moved under packages/.
        include:
          - name: dataset_service
            context: ./packages/modelgate-server/dataset_service
          - name: audit_service
            context: ./packages/modelgate-server/audit_service
          - name: analysis_service
            context: ./packages/modelgate-server/analysis_service
          - name: report_service
            context: ./packages/modelgate-server/report_service
          - name: auth_service
            context: ./packages/modelgate-server/auth_service
          - name: streamlit_app
            context: ./packages/modelgate-streamlit
          - name: frontend
            context: ./packages/modelgate-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        # PRs only build (never push) to avoid flooding the registry with
        # untagged/throwaway images — only pushes to main publish.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build args (frontend only)
        id: build_args
        run: |
          if [ "${{ matrix.name }}" = "frontend" ]; then
            echo "args=VITE_API_BASE_URL=http://localhost:8080" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase repository owner (GHCR requires lowercase image names)
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          build-args: ${{ steps.build_args.outputs.args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/modelgate-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/modelgate-${{ matrix.name }}:${{ github.sha }}
